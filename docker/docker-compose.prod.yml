# Production docker-compose for minikb
# Usage:
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# web = FastAPI API; frontend = Next standalone; worker = ingest.

x-minikb-image: &minikb_image ${MINIKB_IMAGE:-ghcr.io/<owner>/minikb:latest}

services:
  # ─── Infrastructure ────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: minikb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MINIKB_POSTGRES_USER:-minikb}
      POSTGRES_PASSWORD: ${MINIKB_POSTGRES_PASSWORD:-minikb}
      POSTGRES_DB: ${MINIKB_POSTGRES_DB:-minikb}
    ports:
      - "${MINIKB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - minikb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MINIKB_POSTGRES_USER:-minikb} -d ${MINIKB_POSTGRES_DB:-minikb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: minikb-redis
    restart: unless-stopped
    ports:
      - "${MINIKB_REDIS_PORT:-6379}:6379"
    volumes:
      - minikb_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:latest
    container_name: minikb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIKB_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIKB_S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIKB_S3_PORT:-9000}:9000"
      - "${MINIKB_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minikb_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIKB_S3_BUCKET:-minikb} &&
      exit 0
      "

  # ─── Database Migration ────────────────────────────────────────

  migrate:
    image: *minikb_image
    container_name: minikb-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MINIKB_ENV: prod
      MINIKB_POSTGRES_DSN: postgresql+psycopg://${MINIKB_POSTGRES_USER:-minikb}:${MINIKB_POSTGRES_PASSWORD:-minikb}@postgres:5432/${MINIKB_POSTGRES_DB:-minikb}
    command: >
      sh -c "
      alembic -c /app/alembic.ini upgrade head ||
      python -c 'from minikb.db import init_db; import asyncio; asyncio.run(init_db())'
      "
    restart: "no"

  # ─── API Server ────────────────────────────────────────────────

  web:
    image: *minikb_image
    container_name: minikb-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MINIKB_PORT:-8080}:8080"
    environment:
      MINIKB_ENV: prod
      MINIKB_HOST: 0.0.0.0
      MINIKB_PORT: 8080
      MINIKB_LOG_LEVEL: ${MINIKB_LOG_LEVEL:-INFO}
      MINIKB_POSTGRES_DSN: postgresql+psycopg://${MINIKB_POSTGRES_USER:-minikb}:${MINIKB_POSTGRES_PASSWORD:-minikb}@postgres:5432/${MINIKB_POSTGRES_DB:-minikb}
      MINIKB_REDIS_URL: redis://redis:6379/0
      MINIKB_S3_ENDPOINT: minio:9000
      MINIKB_S3_ACCESS_KEY: ${MINIKB_S3_ACCESS_KEY:-minioadmin}
      MINIKB_S3_SECRET_KEY: ${MINIKB_S3_SECRET_KEY:-minioadmin}
      MINIKB_S3_BUCKET: ${MINIKB_S3_BUCKET:-minikb}
      MINIKB_S3_SECURE: "false"
      MINIKB_OPENAI_API_KEY: ${MINIKB_OPENAI_API_KEY:-}
      MINIKB_OPENAI_BASE_URL: ${MINIKB_OPENAI_BASE_URL:-https://api.openai.com/v1}
      MINIKB_EMBEDDING_MODEL: ${MINIKB_EMBEDDING_MODEL:-text-embedding-3-small}
      MINIKB_EMBEDDING_DIM: ${MINIKB_EMBEDDING_DIM:-1536}
      MINIKB_DEFAULT_ORG_SLUG: ${MINIKB_DEFAULT_ORG_SLUG:-default}
      MINIKB_REQUIRE_API_KEY: ${MINIKB_REQUIRE_API_KEY:-true}
      MINIKB_JWT_SECRET: ${MINIKB_JWT_SECRET:-}
      MINIKB_JWT_ISSUER: ${MINIKB_JWT_ISSUER:-https://auth.liuyidi.me}
      MINIKB_JWT_AUDIENCE: ${MINIKB_JWT_AUDIENCE:-mini-auth}
      MINIKB_MAX_UPLOAD_MB: ${MINIKB_MAX_UPLOAD_MB:-100}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      uvicorn minikb.main:app
        --host 0.0.0.0
        --port 8080
        --workers ${MINIKB_WEB_WORKERS:-2}
        --log-level info
        --access-log
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Ingest Worker ─────────────────────────────────────────────

  worker:
    image: *minikb_image
    container_name: minikb-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MINIKB_ENV: prod
      MINIKB_LOG_LEVEL: ${MINIKB_LOG_LEVEL:-INFO}
      MINIKB_POSTGRES_DSN: postgresql+psycopg://${MINIKB_POSTGRES_USER:-minikb}:${MINIKB_POSTGRES_PASSWORD:-minikb}@postgres:5432/${MINIKB_POSTGRES_DB:-minikb}
      MINIKB_REDIS_URL: redis://redis:6379/0
      MINIKB_S3_ENDPOINT: minio:9000
      MINIKB_S3_ACCESS_KEY: ${MINIKB_S3_ACCESS_KEY:-minioadmin}
      MINIKB_S3_SECRET_KEY: ${MINIKB_S3_SECRET_KEY:-minioadmin}
      MINIKB_S3_BUCKET: ${MINIKB_S3_BUCKET:-minikb}
      MINIKB_S3_SECURE: "false"
      MINIKB_OPENAI_API_KEY: ${MINIKB_OPENAI_API_KEY:-}
      MINIKB_OPENAI_BASE_URL: ${MINIKB_OPENAI_BASE_URL:-https://api.openai.com/v1}
      MINIKB_EMBEDDING_MODEL: ${MINIKB_EMBEDDING_MODEL:-text-embedding-3-small}
      MINIKB_EMBEDDING_DIM: ${MINIKB_EMBEDDING_DIM:-1536}
      MINIKB_INGEST_CONCURRENCY: ${MINIKB_INGEST_CONCURRENCY:-4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: >
      python -m minikb.worker
    deploy:
      resources:
        limits:
          memory: 2G

  # ─── Next admin (standalone) ───────────────────────────────────

  frontend:
    image: ${MINIKB_WEB_IMAGE:?set MINIKB_WEB_IMAGE}
    container_name: minikb-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MINIAUTH_ISSUER: ${MINIAUTH_ISSUER:-https://auth.liuyidi.me}
      MINIAUTH_CLIENT_ID: ${MINIAUTH_CLIENT_ID:-minikb}
      MINIAUTH_REDIRECT_URI: ${MINIAUTH_REDIRECT_URI:-https://kb.liuyidi.me/login/callback}
      MINIKB_PUBLIC_ORIGIN: ${MINIKB_PUBLIC_ORIGIN:-https://kb.liuyidi.me}
      MINIKB_SESSION_SECRET: ${MINIKB_SESSION_SECRET:?set MINIKB_SESSION_SECRET}
      MINIKB_API_URL: http://web:8080
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Metrics (optional) ────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: minikb-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${MINIKB_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - minikb_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'

volumes:
  minikb_pgdata:
  minikb_redisdata:
  minikb_miniodata:
  minikb_prometheus_data:
