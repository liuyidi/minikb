services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: minikb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minikb
      POSTGRES_PASSWORD: minikb
      POSTGRES_DB: minikb
    ports:
      - "5432:5432"
    volumes:
      - minikb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minikb -d minikb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: minikb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: docker.m.daocloud.io/minio/minio:latest
    container_name: minikb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minikb_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-bootstrap:
    image: docker.m.daocloud.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb --ignore-existing local/minikb) &&
      mc anonymous set download local/minikb &&
      exit 0
      "

volumes:
  minikb_pgdata:
  minikb_miniodata:
