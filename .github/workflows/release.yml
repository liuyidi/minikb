name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Deploy this existing image tag
        required: false
        default: latest

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          set -euo pipefail

          repo_lc="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            commit_sha="$GITHUB_SHA_VALUE"
            branch_name="$REF_NAME"
            image_tag="${DISPATCH_IMAGE_TAG:-latest}"
            should_release="true"
            release_reason="manual"
            result_status="pending"
          elif [[ "$WORKFLOW_CONCLUSION" == "success" ]]; then
            commit_sha="$WORKFLOW_HEAD_SHA"
            branch_name="$WORKFLOW_HEAD_BRANCH"
            image_tag="latest"
            should_release="true"
            release_reason="workflow_run"
            result_status="pending"
          else
            commit_sha="$WORKFLOW_HEAD_SHA"
            branch_name="$WORKFLOW_HEAD_BRANCH"
            image_tag="latest"
            should_release="false"
            release_reason="ci_not_successful"
            result_status="skipped:${WORKFLOW_CONCLUSION:-unknown}"
          fi

          short_sha="$(printf '%s' "$commit_sha" | cut -c1-7)"
          image_repository="ghcr.io/${repo_lc}"
          image_ref="${image_repository}:${image_tag}"
          sha_image_ref="${image_repository}:sha-${short_sha}"

          {
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "branch_name=$branch_name"
            echo "image_tag=$image_tag"
            echo "image_repository=$image_repository"
            echo "image_ref=$image_ref"
            echo "sha_image_ref=$sha_image_ref"
            echo "should_release=$should_release"
            echo "release_reason=$release_reason"
            echo "result_status=$result_status"
            echo "target_host=$ECS_HOST"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release commit
        if: steps.meta.outputs.should_release == 'true' && steps.meta.outputs.release_reason == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.commit_sha }}

      - name: Set up Docker Buildx
        if: steps.meta.outputs.should_release == 'true' && steps.meta.outputs.release_reason == 'workflow_run'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for publish
        if: steps.meta.outputs.should_release == 'true' && steps.meta.outputs.release_reason == 'workflow_run'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build
        if: steps.meta.outputs.should_release == 'true' && steps.meta.outputs.release_reason == 'workflow_run'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ecs
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.sha_image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write SSH key
        if: steps.meta.outputs.should_release == 'true'
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" > "$RUNNER_TEMP/minikb-ecs.key"
          chmod 600 "$RUNNER_TEMP/minikb-ecs.key"

      - name: Deploy to ECS
        id: deploy
        if: steps.meta.outputs.should_release == 'true'
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          set -euo pipefail

          remote_env=(
            "IMAGE_REF=$(printf '%q' "$IMAGE_REF")"
            "GHCR_USERNAME=$(printf '%q' "$GHCR_USERNAME")"
            "GHCR_READ_TOKEN=$(printf '%q' "$GHCR_READ_TOKEN")"
          )

          ssh \
            -i "$RUNNER_TEMP/minikb-ecs.key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "$ECS_USER@$ECS_HOST" \
            "${remote_env[*]} bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/minikb

          if [[ -f .env ]]; then
            grep -v '^MINIKB_IMAGE=' .env > .env.release.tmp || true
            mv .env.release.tmp .env
          fi
          printf 'MINIKB_IMAGE=%s\n' "$IMAGE_REF" >> .env

          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          set -a
          . ./.env
          set +a

          docker compose --env-file .env -f docker-compose.prod.yml pull
          docker compose --env-file .env -f docker-compose.prod.yml up -d
          curl --fail --silent --show-error "http://127.0.0.1:${MINIKB_PORT:-8080}/health/live" >/dev/null
          REMOTE

      - name: Notify Feishu
        if: always()
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ steps.meta.outputs.branch_name }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          TARGET_HOST: ${{ steps.meta.outputs.target_host }}
          SHOULD_RELEASE: ${{ steps.meta.outputs.should_release }}
          INITIAL_RESULT_STATUS: ${{ steps.meta.outputs.result_status }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            result_status="$JOB_STATUS"
          else
            result_status="$INITIAL_RESULT_STATUS"
          fi

          payload="$(cat <<EOF
          {
            "msg_type": "text",
            "content": {
              "text": "minikb release\\nrepository: ${REPOSITORY}\\nbranch: ${BRANCH_NAME}\\ncommit SHA: ${COMMIT_SHA}\\nimage tag: ${IMAGE_TAG}\\ntarget host: ${TARGET_HOST}\\nresult status: ${result_status}"
            }
          }
          EOF
          )"

          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$FEISHU_WEBHOOK_URL"
