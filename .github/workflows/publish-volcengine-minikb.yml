name: Publish Volcengine Minikb

# Rsync this commit to Volcengine (/opt/minikb) and docker compose build on the host.
# Do not push/pull GHCR app images — GHCR from this region is too slow.
#
# Required secrets: ECS_SSH_KEY, SERVERLESSSHIP_TOKEN_MINIKB (or SERVERLESSSHIP_TOKEN)
# Optional vars: ECS_HOST / ECS_USER / ECS_SSH_PORT / SERVERLESSSHIP_RELEASE_URL
#
# Trigger: push to main (app/Docker paths) or Actions → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic/**"
      - "alembic.ini"
      - "docker/**"
      - "web/**"
      - "packages/ui/**"
      - "packages/chat/**"
      - "deploy/remote-build.sh"
      - ".github/workflows/publish-volcengine-minikb.yml"

concurrency:
  group: publish-volcengine-minikb
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      ECS_HOST: ${{ vars.ECS_HOST || '101.96.224.232' }}
      ECS_USER: ${{ vars.ECS_USER || 'root' }}
      ECS_SSH_PORT: ${{ vars.ECS_SSH_PORT || 22 }}

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Resolve release metadata
        id: meta
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit_sha="$GITHUB_SHA_VALUE"
          short_sha="$(printf '%s' "$commit_sha" | cut -c1-7)"
          {
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"
          echo "commit=$short_sha host=${ECS_HOST}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.commit_sha }}

      - name: Write SSH key
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SSH_KEY:-}" ]]; then
            echo "ECS_SSH_KEY secret is empty" >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" > "$RUNNER_TEMP/minikb-ecs.key"
          chmod 600 "$RUNNER_TEMP/minikb-ecs.key"
          ssh-keygen -lf "$RUNNER_TEMP/minikb-ecs.key"

      - name: Rsync source and build on host
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/minikb-ecs.key"
            -p "$ECS_SSH_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
          )

          echo "rsync $(git rev-parse --short HEAD) → ${ECS_USER}@${ECS_HOST}:/opt/minikb"

          ssh "${SSH_OPTS[@]}" "$ECS_USER@$ECS_HOST" 'install -d /opt/minikb'
          rsync -az --delete \
            -e "ssh ${SSH_OPTS[*]}" \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude '.git' \
            --exclude '.venv/' \
            --exclude '**/node_modules/' \
            --exclude '**/.next/' \
            --exclude '*.pem' \
            ./ "$ECS_USER@$ECS_HOST:/opt/minikb/"

          ssh "${SSH_OPTS[@]}" "$ECS_USER@$ECS_HOST" 'bash /opt/minikb/deploy/remote-build.sh'

  notify-serverlessship:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVERLESSSHIP_RELEASE_URL: ${{ vars.SERVERLESSSHIP_RELEASE_URL }}
      SERVERLESSSHIP_TOKEN: ${{ secrets.SERVERLESSSHIP_TOKEN_MINIKB || secrets.SERVERLESSSHIP_TOKEN }}

    steps:
      - name: Send deploy notification to ServerlessShip
        run: |
          set -euo pipefail

          if [[ -z "${SERVERLESSSHIP_TOKEN:-}" ]]; then
            echo "Missing SERVERLESSSHIP_TOKEN_MINIKB (or SERVERLESSSHIP_TOKEN) secret." >&2
            exit 1
          fi

          serverlessship_release_url="${SERVERLESSSHIP_RELEASE_URL:-https://serverless-ship.liuyidi.me/api/releases}"

          payload="$(node -e 'process.stdout.write(JSON.stringify({
            project: "minikb",
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            releaseUrl: process.env.RELEASE_URL,
            workflowUrl: process.env.WORKFLOW_URL,
            channel: "Volcengine",
          }));')"

          response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${SERVERLESSSHIP_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$serverlessship_release_url"
          )"

          echo "$response"
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.short_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_URL: https://kb.liuyidi.me
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
