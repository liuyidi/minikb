name: Publish Volcengine Minikb

# Build GHCR image and deploy to Volcengine ECS (/opt/minikb).
# Host default: 101.96.224.232 (same contract as release.yml).
#
# Required secrets:
#   ECS_SSH_KEY, GHCR_USERNAME, GHCR_READ_TOKEN
# Optional:
#   vars ECS_HOST / ECS_USER / ECS_SSH_PORT / SERVERLESSSHIP_RELEASE_URL
#
# Trigger: push to main (app/Docker paths) or Actions → Run workflow.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy existing GHCR tag (skip build). Empty = build this commit as latest + sha-*"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic/**"
      - "alembic.ini"
      - "docker/Dockerfile"
      - "docker/Dockerfile.ecs"
      - "docker/docker-compose.prod.yml"
      - ".github/workflows/publish-volcengine-minikb.yml"

concurrency:
  group: publish-volcengine-minikb
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    env:
      ECS_HOST: ${{ vars.ECS_HOST || '101.96.224.232' }}
      ECS_USER: ${{ vars.ECS_USER || 'root' }}
      ECS_SSH_PORT: ${{ vars.ECS_SSH_PORT || 22 }}

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image_ref: ${{ steps.meta.outputs.image_ref }}

    steps:
      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_repository="ghcr.io/${repo_lc}"
          commit_sha="$GITHUB_SHA_VALUE"
          short_sha="$(printf '%s' "$commit_sha" | cut -c1-7)"
          should_build="true"
          image_tag="latest"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${DISPATCH_IMAGE_TAG:-}" ]]; then
            should_build="false"
            image_tag="$DISPATCH_IMAGE_TAG"
          fi

          image_ref="${image_repository}:${image_tag}"
          sha_image_ref="${image_repository}:sha-${short_sha}"

          {
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "should_build=$should_build"
            echo "image_tag=$image_tag"
            echo "image_repository=$image_repository"
            echo "image_ref=$image_ref"
            echo "sha_image_ref=$sha_image_ref"
          } >> "$GITHUB_OUTPUT"

          echo "image_ref=$image_ref should_build=$should_build host=${ECS_HOST}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.commit_sha }}

      - name: Set up Docker Buildx
        if: steps.meta.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.meta.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ecs
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.sha_image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write SSH key
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SSH_KEY:-}" ]]; then
            echo "ECS_SSH_KEY secret is empty" >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" > "$RUNNER_TEMP/minikb-ecs.key"
          chmod 600 "$RUNNER_TEMP/minikb-ecs.key"
          ssh-keygen -lf "$RUNNER_TEMP/minikb-ecs.key"

      - name: Sync compose and deploy
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          SSH=(
            ssh
            -i "$RUNNER_TEMP/minikb-ecs.key"
            -p "$ECS_SSH_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
          )
          SCP=(
            scp
            -i "$RUNNER_TEMP/minikb-ecs.key"
            -P "$ECS_SSH_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
          )

          echo "deploying ${IMAGE_REF} → ${ECS_USER}@${ECS_HOST}:/opt/minikb"

          "${SSH[@]}" "$ECS_USER@$ECS_HOST" 'install -d /opt/minikb'
          "${SCP[@]}" docker/docker-compose.prod.yml \
            "$ECS_USER@$ECS_HOST:/opt/minikb/docker-compose.prod.yml"

          remote_env=(
            "IMAGE_REF=$(printf '%q' "$IMAGE_REF")"
            "GHCR_USERNAME=$(printf '%q' "$GHCR_USERNAME")"
            "GHCR_READ_TOKEN=$(printf '%q' "$GHCR_READ_TOKEN")"
          )

          "${SSH[@]}" "$ECS_USER@$ECS_HOST" \
            "${remote_env[*]} bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/minikb

          if [[ -f .env ]]; then
            grep -v '^MINIKB_IMAGE=' .env > .env.release.tmp || true
            mv .env.release.tmp .env
          else
            touch .env
          fi
          printf 'MINIKB_IMAGE=%s\n' "$IMAGE_REF" >> .env

          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a

          docker compose --env-file .env -f docker-compose.prod.yml pull
          docker compose --env-file .env -f docker-compose.prod.yml up -d
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | head -20

          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 "http://127.0.0.1:${MINIKB_PORT:-8080}/health/live" >/tmp/minikb-health.json; then
              echo "health ok after ${i} attempt(s): $(cat /tmp/minikb-health.json)"
              ok=1
              break
            fi
            echo "waiting for minikb health (${i}/40)..."
            sleep 3
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "minikb health check failed; recent logs:"
            docker logs minikb-web --tail 120 || true
            exit 1
          fi
          curl -fsS -o /dev/null -w "local ui %{http_code}\n" \
            "http://127.0.0.1:${MINIKB_PORT:-8080}/ui/" || true
          REMOTE

  notify-serverlessship:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVERLESSSHIP_RELEASE_URL: ${{ vars.SERVERLESSSHIP_RELEASE_URL }}

    steps:
      - name: Send deploy notification to ServerlessShip
        run: |
          set -euo pipefail

          serverlessship_release_url="${SERVERLESSSHIP_RELEASE_URL:-https://serverless-ship.liuyidi.me/api/releases}"

          payload="$(node -e 'process.stdout.write(JSON.stringify({
            project: "minikb",
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            releaseUrl: process.env.RELEASE_URL,
            workflowUrl: process.env.WORKFLOW_URL,
            channel: "Volcengine",
          }));')"

          response="$(
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$serverlessship_release_url"
          )"

          echo "$response"
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.short_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_URL: ${{ needs.publish.outputs.image_ref }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
